[project]
name = "src"
version = "0.1.0"
description = ""
authors = [
    {name = "reymondsacha",email = "reymondsacha@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy (>=2.3.5,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "scipy (>=1.16.3,<2.0.0)",
    "yfinance (>=0.2.66,<0.3.0)",
    "pyarrow (>=22.0.0,<23.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "statsmodels (>=0.14.6,<0.15.0)"
]

[tool.poetry]
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ruff (>=0.14.8,<0.15.0)",
    "jupyterlab (>=4.5.0,<5.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pyright (>=1.1.407,<2.0.0)",
    "ipykernel (>=7.1.0,<8.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]